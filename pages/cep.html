<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <link rel="stylesheet" href="../style/style.css">
        <title>CEP</title>
    </head>

    <body>
        <div class="container">
            <div class="card">
                <div class="tema">
                    <span>Alterar tema</span>
                    <div class="toggle"></div>
                </div>

                <h1>Pesquise</h1>
                <form>
                    <label for="cep">
                        CEP
                        <input type="text" id="cep" oninput="cepFormat(this)">
                    </label>

                    <input type="button" onclick="apiCep()" value="Consultar">
                </form>

                <div id="load"></div>

                <div class="resposta">
                    <label for="logradouro">
                        Endereço:
                        <input type="text" id="logradouro" readonly>
                    </label>

                    <br/>

                    <label for="complemento">
                        Complemento:
                        <input type="text" id="complemento" readonly>
                    </label>

                    <br/>

                    <label for="bairro">
                        Bairro: 
                        <input type="text" id="bairro" readonly>
                    </label>

                    <br/>

                    <label for="localidade">
                        Cidade:
                        <input type="text" id="localidade" readonly>
                    </label>

                    <br/>

                    <label for="estado">
                        Estado:
                        <input type="text" id="estado">
                    </label>
                </div>

                <div class="erro"></div>
            </div>

            <a href="../index.html">Voltar</a>
        </div>

        <script src="../script/dark-mode.js"></script>
        <script src="../script/connect.js"></script>
        <script src="../script/format.js"></script>
        <script src="../script/cep.js"></script>
    </body>
</html>
