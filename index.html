<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <link rel="stylesheet" href="style/style.css">
        <title>Projetos</title>
    </head>

    <body>
        <div class="container">
            <div class="card">
                <details>
                    <summary>Projeto 1: Alterar Tema</summary>
                    <div class="detalhes">
                        <p>Alterne entre os temas claro e escuro: </p>
                        <div class="toggle"></div>
                    </div>
                </details>

                <details>
                    <summary>Projeto 2: Consulta de endereços</summary>
                    <div class="detalhes">
                        <p>Conheça informações de um cep através da Api Viacep.</p>
                        <button class="openCep" onclick="showDialog(dialogCep, this)">Veja</button>

                        <dialog id="dialogCep">
                            <button class="close" onclick="showDialog(dialogCep, this)"><i class="fa fa-close"></i></button>

                            <form>
                                <label for="cep">
                                    CEP
                                    <input type="text" id="cep" oninput="cepFormat(this)">
                                </label>

                                <input type="button" onclick="apiCep()" value="Consultar">
                            </form>

                            <div id="load"></div>

                            <div class="resposta">
                                <label for="logradouro">
                                    Endereço:
                                    <input type="text" id="logradouro" readonly>
                                </label>

                                <br/>

                                <label for="complemento">
                                    Complemento:
                                    <input type="text" id="complemento" readonly>
                                </label>

                                <br/>

                                <label for="bairro">
                                    Bairro: 
                                    <input type="text" id="bairro" readonly>
                                </label>

                                <br/>

                                <label for="localidade">
                                    Cidade:
                                    <input type="text" id="localidade" readonly>
                                </label>

                                <br/>

                                <label for="estado">
                                    Estado:
                                    <input type="text" id="estado">
                                </label>
                            </div>

                            <div class="erro"></div>
                        </dialog>
                    </div>
                </details>

                <details>
                    <summary>Projeto 3: Calcular idade</summary>
                    <div class="detalhes">
                        <label for="birthday">Calcule sua idade:
                            <input type="date" id="birthday" onchange="calcularIdade(value)" />
                        </label>

                        <div id="idade"></div>

                        <div class="erroIdade"></div>
                    </div>
                </details>

                <details>
                    <summary>Projeto 4: Imagem</summary>
                    <div class="detalhes">
                        <p>Escolha uma imagem.</p>
                        <button class="openImg" onclick="showDialog(dialogImg, this)">Veja</button>

                        <dialog id="dialogImg">
                            <button class="close" onclick="showDialog(dialogImg, this)"><i class="fa fa-close"></i></button>

                            <div id="manipule">
                                <input type="file" accept="image/jpeg, image/png" id="file-img">

                                <div id="icons">
                                    <i class="fa fa-eye-slash"></i>
                                    <i class="fa fa-eye"></i>
                                    <i class="fa fa-search-plus"></i>
                                    <i class="fa fa-search-minus"></i>
                                    <i class="fa fa-undo"></i>
                                </div>

                                <section>
                                    <div id="img-content"><img src="" id="image-chosen"></div>
                                    <div id="visibility"></div>
                                </section>
                            </div>
                        </dialog>
                    </div>
                </details>
            </div>
        </div>

        <script src="script/dark-mode.js"></script>
        <script src="script/idade.js"></script>
        <script src="script/format.js"></script>
        <script src="script/connect.js"></script>
        <script src="script/cep.js"></script>
        <script src="script/dialog.js"></script>
        <script src="script/image.js"></script>
    </body>
</html>
